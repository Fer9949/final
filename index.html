<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cumplimiento de Ciberseguridad y Protección de Datos</title>
    <style>
        @media print {
            /* Ocultar todo excepto el dashboard */
            body > * { display: none !important; }
            #root > * { display: none !important; }
            aside { display: none !important; }
            header { display: none !important; }
            .flex.h-screen { display: block !important; }
            main { display: block !important; overflow: visible !important; }
            main > header { display: none !important; }
            #dashboard-print-area { display: block !important; }
            #dashboard-print-area * { display: revert !important; }
            /* Ocultar botones dentro del dashboard */
            button { display: none !important; }
            @page { margin: 10mm; size: A4; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
